<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc">
  <title id="title">AI marketplace publication and managed execution</title>
  <desc id="desc">Team submissions pass trusted verification and review before publication. Engineers access isolated runners through identity and policy checks. Connectors enforce resource permissions and obtain credentials from Vault. Assets cannot directly access resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#52647a"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#183047;font-size:13px}
      .label{font-size:11px;fill:#52647a}.lane{font-size:12px;font-weight:bold;letter-spacing:1px}
      .box{fill:#fff;stroke:#9bafc1;stroke-width:1.2;rx:7}.trusted{fill:#eaf2fb;stroke:#537aab;stroke-width:1.2;rx:7}
      .flow{fill:none;stroke:#52647a;stroke-width:1.4;marker-end:url(#arrow)}
      .credential{fill:none;stroke:#52647a;stroke-width:1.3;stroke-dasharray:4 3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="818" height="111" rx="10" fill="#f2f5f8"/>
  <text x="16" y="23" class="lane">PUBLISH · SUBMITTED CONTENT IS UNTRUSTED</text>
  <rect class="box" x="16" y="40" width="168" height="54"/>
  <text x="100" y="61" text-anchor="middle">Team / Bitbucket</text><text x="100" y="80" text-anchor="middle" class="label">Manifest, code, tests, docs</text>
  <path class="flow" d="M184 67 H204"/>
  <rect class="trusted" x="208" y="40" width="178" height="54"/>
  <text x="297" y="61" text-anchor="middle">Jenkins verification</text><text x="297" y="80" text-anchor="middle" class="label">Policy, scans, tests, evals</text>
  <path class="flow" d="M386 67 H406"/>
  <rect class="trusted" x="410" y="40" width="176" height="54"/>
  <text x="498" y="61" text-anchor="middle">Review / promotion gate</text><text x="498" y="80" text-anchor="middle" class="label">Artifact-bound approval</text>
  <path class="flow" d="M586 67 H606"/>
  <rect class="trusted" x="610" y="40" width="194" height="54"/>
  <text x="707" y="61" text-anchor="middle">Catalog + Artifactory</text><text x="707" y="80" text-anchor="middle" class="label">Approved metadata, artifacts</text>
  <rect x="1" y="122" width="818" height="247" rx="10" fill="#f4f8f6"/>
  <text x="16" y="144" class="lane">USE · PLATFORM-CONTROLLED EXECUTION</text>
  <rect class="box" x="16" y="169" width="140" height="62"/>
  <text x="86" y="193" text-anchor="middle">Engineer / portal</text><text x="86" y="213" text-anchor="middle" class="label">Discover, enable, run</text>
  <path class="flow" d="M156 200 H173"/>
  <rect class="trusted" x="177" y="169" width="153" height="62"/>
  <text x="253" y="192" text-anchor="middle">Identity + policy</text><text x="253" y="213" text-anchor="middle" class="label">User, scope, live approval</text>
  <path class="flow" d="M330 200 H347"/>
  <rect class="trusted" x="351" y="169" width="152" height="62"/>
  <text x="427" y="192" text-anchor="middle">Isolated runner</text><text x="427" y="213" text-anchor="middle" class="label">Pinned asset + dependencies</text>
  <path class="flow" d="M503 200 H520"/>
  <rect class="trusted" x="524" y="160" width="151" height="80"/>
  <text x="599" y="181" text-anchor="middle">Managed connectors</text><text x="599" y="199" text-anchor="middle" class="label">Model gateway / MCP / APIs</text><text x="599" y="217" text-anchor="middle" class="label">Per-operation policy checks</text><text x="599" y="232" text-anchor="middle" class="label">Only permitted egress</text>
  <path class="flow" d="M675 200 H693"/>
  <rect class="box" x="697" y="155" width="107" height="90"/>
  <text x="750" y="177" text-anchor="middle">Resources</text><text x="750" y="196" text-anchor="middle" class="label">Approved models</text><text x="750" y="214" text-anchor="middle" class="label">Jira / findings</text><text x="750" y="232" text-anchor="middle" class="label">Labs / schedulers</text>
  <path class="flow" d="M707 94 V135 H427 V164"/>
  <text x="551" y="130" class="label">Approved release only</text>
  <rect class="trusted" x="524" y="276" width="151" height="43"/>
  <text x="599" y="294" text-anchor="middle">Vault</text><text x="599" y="310" text-anchor="middle" class="label">Scoped connector credentials</text>
  <path class="credential" d="M599 276 V246"/>
  <rect class="trusted" x="177" y="276" width="326" height="43"/>
  <text x="340" y="294" text-anchor="middle">Audit + outcome telemetry</text><text x="340" y="310" text-anchor="middle" class="label">Versions, decisions, quality, cost · redact payloads</text>
  <path class="flow" d="M253 231 V271"/><path class="flow" d="M427 231 V271"/>
  <text x="16" y="347" class="label">Lab/simulation connectors are deployed near resources. Downstream authorization and physical safeguards still apply.</text>
</svg>
